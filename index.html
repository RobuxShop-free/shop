
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopRobuxLuaDao - Key System</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;background:#fff;color:#26352b;
  min-height:100vh;
}
body:before,body:after{
  content:"";position:fixed;width:500px;height:500px;border:2px solid #d9f4df;
  border-radius:50%;z-index:-1;pointer-events:none;
}
body:before{top:-300px;left:-180px}
body:after{bottom:-350px;right:-180px}
header{
  padding:20px 7%;display:flex;justify-content:space-between;
  align-items:center;border-bottom:1px solid #e5f4e8;
}
.logo{font-size:23px;font-weight:bold;color:#39a85b}
button{
  border:0;border-radius:10px;padding:13px 22px;
  background:#55c878;color:white;font-weight:bold;cursor:pointer;
}
button:hover{background:#36a95c}
main{max-width:650px;margin:65px auto;padding:20px}
.panel{
  background:white;border:1px solid #d9f0df;border-radius:18px;
  padding:30px;box-shadow:0 8px 30px #b5d9bf30;
}
h1{color:#32a85a;text-align:center}
p{text-align:center;color:#647368;line-height:1.6}
input{
  width:100%;padding:14px;margin:12px 0;
  border:1px solid #cfe6d4;border-radius:9px;font-size:16px;
}
.robot{
  border:1px solid #ccc;background:#fafafa;padding:18px;
  display:flex;align-items:center;gap:13px;margin:25px 0;
  border-radius:5px;cursor:pointer;
}
.robot input{width:22px;height:22px;margin:0}
.robot span{font-size:15px;color:#333}
.page{display:none}
.page.active{display:block}
.script{
  background:#17231c;color:#b7f5c8;padding:18px;border-radius:10px;
  overflow-wrap:anywhere;line-height:1.6;font-size:13px;
}
.small{font-size:13px;color:#849188}
</style>
</head>
<body>

<header>
  <div class="logo">ShopRobuxLuaDao</div>
  <button onclick="showPage('home')">Trang chủ</button>
</header>

<main>
  <section id="home" class="page active">
    <div class="panel">
      <h1>KEY SYSTEM</h1>
      <p>Hoàn thành nhiệm vụ để truy cập trang nhận LuaHook Script.</p>
      <button style="width:100%" onclick="showPage('tasks')">
        LẤY KEY
      </button>
    </div>
  </section>

  <section id="tasks" class="page">
    <div class="panel">
      <h1>Xác minh nhiệm vụ</h1>
      <p>Hoàn thành các bước bên dưới để tiếp tục.</p>

      <h3>Nhiệm vụ 1: Xác minh robot</h3>
      <label class="robot">
        <input type="checkbox" id="robotCheck">
        <span>I am not robot</span>
      </label>

      <h3>Nhiệm vụ 2: Giải phép tính</h3>
      <p>1 + 1 = ?</p>
      <input id="answer" type="number" placeholder="Nhập kết quả">
      <button style="width:100%" onclick="verifyTasks()">
        XÁC NHẬN
      </button>
      <p id="error" style="color:#e34d4d"></p>
    </div>
  </section>

  <section id="result" class="page">
    <div class="panel">
      <h1>Hoàn thành nhiệm vụ!</h1>
      <p>Bạn đã hoàn thành các bước xác minh.</p>
      <p><b>LuaHook Script</b></p>
      <div class="script" id="scriptText"></div>
      <button style="width:100%;margin-top:15px" onclick="copyScript()">
        SAO CHÉP SCRIPT
      </button>
      <p id="copied" class="small"></p>
      <button style="width:100%;margin-top:10px;background:#8a9b8e"
        onclick="showPage('home')">QUAY VỀ TRANG CHỦ</button>
    </div>
  </section>
</main>

<script>
const script =
'loadstring(game:HttpGet("https://raw.githubusercontent.com/elucidwtf/luahookfree/refs/heads/main/loader.lua"))()';

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function verifyTasks(){
  const robot=document.getElementById('robotCheck').checked;
  const answer=document.getElementById('answer').value;

  if(!robot){
    document.getElementById('error').textContent=
      'Vui lòng tích vào ô I am not robot!';
    return;
  }

  if(answer!=='3'){
    document.getElementById('error').textContent=
      'Đáp án chưa chính xác. Hãy thử lại!';
    return;
  }

  document.getElementById('error').textContent='';
  document.getElementById('scriptText').textContent=script;
  showPage('result');
}

async function copyScript(){
  try{
    await navigator.clipboard.writeText(script);
    document.getElementById('copied').textContent='Đã sao chép script!';
  }catch(e){
    document.getElementById('copied').textContent=
      'Không thể tự sao chép. Hãy chọn và sao chép đoạn mã bên trên.';
  }
}
</script>
</body>
</html>
